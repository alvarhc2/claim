[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim"
version = "1.0.0"
description = "Content-modulated low-rank adaptive mixing for limited-data time series classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Àlvar Hernández-Carnerero", email = "alvar.hernandez@upc.edu"},
]
keywords = [
    "time-series",
    "classification",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7", "pillow>=10"]
dev = ["matplotlib>=3.7", "pillow>=10"]

[project.scripts]
claim = "claim.run:main"

[project.urls]
Repository = "https://github.com/alvarhc2/claim"

[tool.setuptools.packages.find]
where = ["src"]
